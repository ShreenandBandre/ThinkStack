# ==============================================================
# ThinkStack - Kubernetes Manifest (Single File)
# Includes: Namespace, Secrets, PVC, DB, Backend, Frontend
# ==============================================================

# ---- Namespace ----
apiVersion: v1
kind: Namespace
metadata:
  name: ThinkStack
  labels:
    app.kubernetes.io/part-of: ThinkStack

---

# ---- Database Secret ----
# Base64 encoded for demo purposes (replace in production!)
apiVersion: v1
kind: Secret
metadata:
  name: ThinkStack-db-secret
  namespace: ThinkStack
  labels:
    app.kubernetes.io/part-of: ThinkStack
type: Opaque
data:
  POSTGRES_USER: amVybmV5X3VzZXI=
  POSTGRES_PASSWORD: amVybmV5X3Bhc3NfMjAyNg==
  POSTGRES_DB: amVybmV5X2Ri

---

# ---- EBS StorageClass (gp3) ----
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: ThinkStack-ebs-sc
provisioner: ebs.csi.eks.amazonaws.com
parameters:
  type: gp3
  encrypted: "true"
reclaimPolicy: Retain
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true

---

# ---- PersistentVolumeClaim for PostgreSQL ----
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ThinkStack-db-pvc
  namespace: ThinkStack
  labels:
    app.kubernetes.io/part-of: ThinkStack
    app.kubernetes.io/component: database
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ThinkStack-ebs-sc
  resources:
    requests:
      storage: 10Gi

---

# ---- PostgreSQL Deployment ----
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ThinkStack-db
  namespace: ThinkStack
  labels:
    app.kubernetes.io/name: ThinkStack-db
    app.kubernetes.io/part-of: ThinkStack
    app.kubernetes.io/component: database
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: ThinkStack-db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ThinkStack-db
        app.kubernetes.io/part-of: ThinkStack
        app.kubernetes.io/component: database
    spec:
      automountServiceAccountToken: false
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
              protocol: TCP
          envFrom:
            - secretRef:
                name: ThinkStack-db-secret
          volumeMounts:
            - name: db-storage
              mountPath: /var/lib/postgresql/data
              subPath: pgdata
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            runAsNonRoot: false
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "ThinkStack_user", "-d", "ThinkStack_db"]
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "ThinkStack_user", "-d", "ThinkStack_db"]
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
      volumes:
        - name: db-storage
          persistentVolumeClaim:
            claimName: ThinkStack-db-pvc

---

# ---- PostgreSQL Service ----
apiVersion: v1
kind: Service
metadata:
  name: ThinkStack-db
  namespace: ThinkStack
  labels:
    app.kubernetes.io/name: ThinkStack-db
    app.kubernetes.io/part-of: ThinkStack
    app.kubernetes.io/component: database
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: ThinkStack-db
  ports:
    - port: 5432
      targetPort: 5432
      protocol: TCP

---

# ---- Backend Deployment ----
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ThinkStack-backend
  namespace: ThinkStack
  labels:
    app.kubernetes.io/name: ThinkStack-backend
    app.kubernetes.io/part-of: ThinkStack
    app.kubernetes.io/component: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: ThinkStack-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ThinkStack-backend
        app.kubernetes.io/part-of: ThinkStack
        app.kubernetes.io/component: backend
    spec:
      automountServiceAccountToken: false
      initContainers:
        - name: wait-for-db
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Waiting for ThinkStack-db:5432..."
              until nc -z ThinkStack-db 5432; do
                echo "DB not ready, retrying in 3s..."
                sleep 3
              done
              echo "DB is ready!"
      containers:
        - name: backend
          image: ghcr.io/iam-veeramalla/Jerney/ThinkStack-backend:75da1da
          ports:
            - containerPort: 5000
              protocol: TCP
          env:
            - name: PORT
              value: "5000"
            - name: DB_HOST
              value: "ThinkStack-db"
            - name: DB_PORT
              value: "5432"
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: ThinkStack-db-secret
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ThinkStack-db-secret
                  key: POSTGRES_PASSWORD
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: ThinkStack-db-secret
                  key: POSTGRES_DB
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop:
                - ALL
          livenessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3

---

# ---- Backend Service ----
apiVersion: v1
kind: Service
metadata:
  name: ThinkStack-backend
  namespace: jerney
  labels:
    app.kubernetes.io/name: ThinkStack-backend
    app.kubernetes.io/part-of: ThinkStack
    app.kubernetes.io/component: backend
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: ThinkStack-backend
  ports:
    - port: 5000
      targetPort: 5000
      protocol: TCP

---

# ---- Frontend Deployment ----
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ThinkStack-frontend
  namespace: ThinkStack
  labels:
    app.kubernetes.io/name: ThinkStack-frontend
    app.kubernetes.io/part-of: ThinkStack
    app.kubernetes.io/component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: ThinkStack-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ThinkStack-frontend
        app.kubernetes.io/part-of: ThinkStack
        app.kubernetes.io/component: frontend
    spec:
      automountServiceAccountToken: false
      containers:
        - name: frontend
          image: ghcr.io/iam-veeramalla/Jerney/ThinkStack-frontend:75da1da
          ports:
            - containerPort: 8080
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            runAsUser: 101
            capabilities:
              drop:
                - ALL
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5

---

# ---- Frontend Service (NodePort) ----
apiVersion: v1
kind: Service
metadata:
  name: ThinkStack-frontend
  namespace: ThinkStack
  labels:
    app.kubernetes.io/name: ThinkStack-frontend
    app.kubernetes.io/part-of: ThinkStack
    app.kubernetes.io/component: frontend
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: ThinkStack-frontend
  ports:
    - port: 80
      targetPort: 8080
      nodePort: 30080
      protocol: TCP

---

# ---- NetworkPolicy: DB only allows Backend ----
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ThinkStack-db-allow-backend-only
  namespace: ThinkStack
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: ThinkStack-db
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: ThinkStack-backend
      ports:
        - port: 5432
          protocol: TCP

---

# ---- NetworkPolicy: Backend only allows Frontend ----
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ThinkStack-backend-allow-frontend-only
  namespace: ThinkStack
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: ThinkStack-backend
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: ThinkStack-frontend
      ports:
        - port: 5000
          protocol: TCP